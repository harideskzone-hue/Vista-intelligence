services:
  - type: web
    name: vista-ai
    plan: free
    env: python
    buildCommand: "apt-get update && apt-get install -y ffmpeg libgl1-mesa-glx && pip install -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
